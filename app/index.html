<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CosyVoice 语音风格工作台</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">声</div>
      <div>
        <h1>CosyVoice 语音风格工作台</h1>
        <p>录音提供音色，语段指定内容，CosyVoice 完成语音生成</p>
      </div>
    </div>
    <div class="status-pill" id="modelStatus">
      <span class="status-dot"></span>
      <span>正在连接模型</span>
    </div>
  </header>

  <main class="layout">
    <section class="panel record-panel">
      <div class="panel-head">
        <span class="step">1</span>
        <div>
          <h2>录制参考语音</h2>
          <p>录一段满意的声音，作为后续生成时的音色参考</p>
        </div>
      </div>

      <div class="mic-wrap">
        <button class="mic-button" id="recordButton" type="button" title="点击开始或停止录音">
          <svg class="mic-on" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
            <line x1="12" y1="19" x2="12" y2="23"></line>
            <line x1="8" y1="23" x2="16" y2="23"></line>
          </svg>
          <svg class="mic-stop" width="34" height="34" viewBox="0 0 24 24" fill="currentColor">
            <rect x="6" y="6" width="12" height="12" rx="2"></rect>
          </svg>
        </button>
        <div class="rec-time" id="recTime">00:00</div>
      </div>

      <canvas id="waveform" width="640" height="90"></canvas>
      <div class="rec-status" id="recStatus">点击麦克风开始录音</div>

      <div class="ref-fields">
        <label for="micDevice">麦克风输入设备</label>
        <select id="micDevice" title="选择想要使用的输入设备">
          <option value="">浏览器默认设备</option>
        </select>
        <label for="refText">录音中说的内容（必须和录音一致，建议填写）</label>
        <input id="refText" value="希望你以后能够做的比我还好呦。" placeholder="例如：希望你以后能够做的比我还好呦。">
        <button class="secondary-button" id="uploadButton" type="button" disabled>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="17 8 12 3 7 8"></polyline>
            <line x1="12" y1="3" x2="12" y2="15"></line>
          </svg>
          把这段录音设为参考音频
        </button>
      </div>

      <div class="preview-area" id="previewArea" hidden>
        <audio id="previewAudio" controls></audio>
      </div>
      <div class="ready-note" id="readyNote" hidden>
        <span class="success-icon">✓</span>
        参考音频已就绪，可以生成语音
      </div>
      <div class="quality-note" id="referenceQuality" hidden></div>
    </section>

    <section class="panel phrase-panel">
      <div class="panel-head">
        <span class="step">2</span>
        <div>
          <h2>选择输出语段</h2>
          <p>从常用语段中选择一句话作为合成内容</p>
        </div>
      </div>
      <input class="search-input" id="phraseSearch" type="search" placeholder="搜索语段，例如：报警、确认、温度">
      <div class="phrase-list" id="phraseList"></div>
    </section>

    <section class="panel generate-panel">
      <div class="panel-head">
        <span class="step">3</span>
        <div>
          <h2>生成语音</h2>
          <p>决定语气来源，然后合成并试听</p>
        </div>
      </div>

      <div class="mode-switch" id="modeSwitch">
        <button type="button" class="mode-btn active" data-mode="record">自然朗读（参考音色）</button>
        <button type="button" class="mode-btn" data-mode="style">使用导演风格</button>
        <button type="button" class="mode-btn" data-mode="reference">模仿参考语调</button>
      </div>

      <div class="style-row" id="styleRow" hidden>
        <label for="styleSelect">语音导演风格</label>
        <select id="styleSelect"></select>
      </div>
      <div class="reference-hint" id="referenceHint" hidden>
        严格模仿模式需要至少 5 秒清晰人声，且参考文本必须和录音内容一致。
      </div>

      <div class="selected-phrase" id="selectedPhrase">请先选择一个输出语段</div>

      <button class="generate-button" id="generateButton" type="button" disabled>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="23 7 16 12 23 17 23 7"></polygon>
          <rect x="1" y="5" width="15" height="14" rx="2"></rect>
        </svg>
        生成语音
      </button>

      <div class="progress-note" id="progressNote" hidden>正在合成，请稍候…</div>

      <div class="result-area" id="resultArea" hidden>
        <h3>生成结果</h3>
        <audio id="resultAudio" controls></audio>
        <div class="metric-grid" id="metricGrid"></div>
      </div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
